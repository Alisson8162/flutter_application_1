# CI do backend: instala dependências e roda a suíte de testes (Jest) a
# cada push/PR que toque em algo dentro de backend/. Todos os testes mockam
# o banco (`jest.mock('../config/database', ...)`), então este workflow não
# precisa subir um Postgres/Redis de verdade - só valida a lógica.
#
# NÃO TESTADO EM EXECUÇÃO: não há como rodar um workflow do GitHub Actions
# de verdade neste ambiente de sandbox. A sintaxe foi revisada à mão -
# confirme numa PR de teste antes de depender disso no dia a dia.
name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    name: Testes (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (só valida - não publica)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: falacomigo-backend:ci

      # Para publicar a imagem em produção, descomente e configure um
      # registry (GHCR, Docker Hub, etc.) com as credenciais em Secrets:
